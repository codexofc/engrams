  <text x="230" y="122" fill="#8a949d">v0.1.0</text>
  <g fill="#eef1f5">
    <text x="24" y="170"><tspan fill="#8a949d">[1/5]</tspan> <tspan font-weight="700">Your notes</tspan></text>
    <text x="24" y="188">  <tspan fill="#e0733b">›</tspan> Directory for your notes: <tspan fill="#8a949d">[~/engram]</tspan> ~/notes</text>
    <text x="24" y="206">  <tspan fill="#5aa47e">✓</tspan> root /Users/me/notes (remembered in ~/.engram/root)</text>
    <text x="24" y="224">  <tspan fill="#e0733b">›</tspan> Turn it into a git repository (notes are worth backing up)? <tspan fill="#8a949d">[Y/n]</tspan></text>
