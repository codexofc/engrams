  <text x="18" y="220" transform="rotate(-90 18 220)" text-anchor="middle" fill="#485864" font-size="11">expected note in the top five (%)</text>
  <circle cx="516.4" cy="164" r="11.5" fill="#2d6a9f" fill-opacity="0.85" stroke="#ffffff" stroke-width="2"/>
  <text x="535.903" y="168" fill="#10202b" font-size="11">granite-multilingual <tspan fill="#7c8a95">75 %, 310 MB, 0.21 s</tspan></text>
