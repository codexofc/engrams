<svg xmlns="http://www.w3.org/2000/svg" width="820" height="290" viewBox="0 0 820 290" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>What reaches the agent's context to reach the note, per query</title>
  <rect width="820" height="290" fill="#ffffff"/>
  <text x="20" y="26" font-size="15" font-weight="700" fill="#10202b">What reaches the agent's context to reach the note, per query</text>
  <text x="20" y="44" font-size="11" fill="#7c8a95">Same 96 blind queries, the real binary and a real grep, tokens estimated at four characters. In brackets, how often the expected note is reached.</text>
  <text x="20" y="66" fill="#485864" font-size="11">grep, every word of the query, then the notes in grep order <tspan fill="#7c8a95">(35 / 96)</tspan></text>
  <rect x="20" y="70" width="709.1" height="18" rx="2" fill="#6f7a84"/>
  <text x="737.05884" y="83" fill="#10202b" font-size="12" font-weight="600">33587 tokens</text>
  <text x="20" y="98" fill="#485864" font-size="11">grep, the three longest words, then the notes in grep order <tspan fill="#7c8a95">(36 / 96)</tspan></text>
  <rect x="20" y="102" width="314.2" height="18" rx="2" fill="#6f7a84"/>
  <text x="342.21777" y="115" fill="#10202b" font-size="12" font-weight="600">14884 tokens</text>
  <text x="20" y="130" fill="#485864" font-size="11">souvenance search, then souvenance read of the note it returned <tspan fill="#7c8a95">(78 / 96)</tspan></text>
  <rect x="20" y="134" width="49.6" height="18" rx="2" fill="#b7410e"/>
  <text x="77.568886" y="147" fill="#10202b" font-size="12" font-weight="600">2348 tokens</text>
  <text x="20" y="162" fill="#485864" font-size="11">souvenance answer, the passages only <tspan fill="#7c8a95">(70 / 96)</tspan></text>
  <rect x="20" y="166" width="10.9" height="18" rx="2" fill="#b7410e"/>
  <text x="38.935555" y="179" fill="#10202b" font-size="12" font-weight="600">518 tokens</text>
  <text x="20" y="194" fill="#485864" font-size="11">souvenance hook, what every prompt receives <tspan fill="#7c8a95">(57 / 96)</tspan></text>
  <rect x="20" y="198" width="5.6" height="18" rx="2" fill="#b7410e"/>
  <text x="33.615555" y="211" fill="#10202b" font-size="12" font-weight="600">266 tokens</text>
  <text x="20" y="276" fill="#7c8a95" font-size="11">Grey: an agent with a notes folder and grep. Rust: the same agent with Souvenance. Default model, every signal on.</text>
</svg>
