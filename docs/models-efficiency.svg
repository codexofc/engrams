<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <title>Result against memory, by model</title>
  <rect width="820" height="420" fill="#ffffff"/>
