    <text x="24" y="306">  <tspan fill="#e0733b">›</tspan> Download it now? <tspan fill="#8a949d">[Y/n]</tspan></text>
    <text x="24" y="324">  downloading model.safetensors  <tspan fill="#8a949d">######################################## 100.0%</tspan></text>
