  <rect x="137" y="52" width="12" height="12" fill="#3d7d5a"/><text x="155" y="62" font-size="11" fill="#485864">BERT (MiniLM)</text>
  <rect x="268" y="52" width="12" height="12" fill="#b7410e"/><text x="286" y="62" font-size="11" fill="#485864">ModernBERT</text>
  <line x1="70" y1="80" x2="70" y2="360" stroke="#e3e7eb"/>
  <text x="70" y="376" text-anchor="middle" fill="#7c8a95" font-size="10">0</text>
  <line x1="430" y1="80" x2="430" y2="360" stroke="#e3e7eb"/>
  <text x="430" y="376" text-anchor="middle" fill="#7c8a95" font-size="10">250</text>
