  <text x="790" y="376" text-anchor="middle" fill="#7c8a95" font-size="10">500</text>
  <line x1="70" y1="360" x2="790" y2="360" stroke="#e3e7eb"/>
  <text x="62" y="364" text-anchor="end" fill="#7c8a95" font-size="10">40</text>
  <line x1="70" y1="304" x2="790" y2="304" stroke="#e3e7eb"/>
  <text x="62" y="308" text-anchor="end" fill="#7c8a95" font-size="10">50</text>
  <line x1="70" y1="248" x2="790" y2="248" stroke="#e3e7eb"/>
  <text x="62" y="252" text-anchor="end" fill="#7c8a95" font-size="10">60</text>
  <line x1="70" y1="192" x2="790" y2="192" stroke="#e3e7eb"/>
  <text x="62" y="196" text-anchor="end" fill="#7c8a95" font-size="10">70</text>
  <line x1="70" y1="136" x2="790" y2="136" stroke="#e3e7eb"/>
